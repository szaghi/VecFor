name = "VecFor"
version = "1.10.0"
author = "Stefano Zaghi"
copyright = "Copyright © 2015-2026, Stefano Zaghi"
license = "GPL-3.0-or-later OR BSD-2-Clause OR BSD-3-Clause OR MIT"
description = "Vector algebra class for Fortran poor people"
maintainer = "Stefano Zaghi"
homepage = "https://github.com/szaghi/VecFor"

# src/ also holds the fobis-fetched copy of PENF (src/third_party) and the generated doctests (src/tests):
# the library is src/lib only, and PENF comes from the [dependencies] below.
[library]
source-dir = "src/lib"

# No PENF_R16P here (issue #23): fpm builds a shared dependency once, from the root package's declaration, so a macro
# set by VecFor for PENF is dropped whenever VecFor is a dependency, while its own copy would still compile the R16P
# overloads against a PENF whose R16P is R8P (ambiguous generics). Without it R16P is R8P and a root that declares PENF
# plainly builds. Quadruple precision is the root's opt-in, the same macro for both packages (fpm test: --flag); the
# macro on PENF alone fails in vecfor_R16P (no real(R16P) overloads against a quad R16P):
#   PENF   = { git = "https://github.com/szaghi/PENF",   preprocess.cpp.macros = ["PENF_R16P"] }
#   VecFor = { git = "https://github.com/szaghi/VecFor", preprocess.cpp.macros = ["PENF_R16P"] }
# VECFOR_NO_QUAD tells vecfor_test_quad_precision that this R8P fallback is intended, not a dead macro.
[dependencies]
PENF = { git = "https://github.com/szaghi/PENF" }

[preprocess]
[preprocess.cpp]
macros = ["VECFOR_NO_QUAD"]

[build]
auto-executables = false
auto-tests = false
# openacc is the compiler's module, used by vecfor_test_device_loop under #ifdef _OPENACC: fpm scans `use`
# statements without preprocessing, so it must be told not to look for its source
external-modules = ["openacc"]

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true

[[test]]
name = "vecfor_test_quad_precision"
source-dir = "src/tests"
main = "vecfor_test_quad_precision.F90"

[[test]]
name = "vecfor_test_device_loop"
source-dir = "src/tests"
main = "vecfor_test_device_loop.F90"

[[test]]
name = "vecfor_test_device_geometry"
source-dir = "src/tests"
main = "vecfor_test_device_geometry.F90"

[[test]]
name = "vecfor_test_accurate_products"
source-dir = "src/tests"
main = "vecfor_test_accurate_products.f90"
