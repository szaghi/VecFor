name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # a release tag points at a commit already tested on its branch push
  pull_request:

# a newer push to the same ref supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: FoBiS.py fetch

    - name: Run tests with coverage
      id: cov
      uses: ./.github/actions/run-coverage-analysis

    # docs.yml (workflow_run) publishes these outputs instead of running the
    # coverage a second time: every file the coverage step wrote or changed
    # under docs/ (badge JSON, coverage-analysis page, per-file gcov pages),
    # git-ignored ones included, so docs.yml sees what a local run would
    - name: Pack the coverage outputs for the docs
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        git ls-files --others --modified -- docs | while IFS= read -r f; do
          if [ -f "$f" ]; then printf '%s\n' "$f"; fi
        done > coverage-docs.list
        cat coverage-docs.list
        tar -czf coverage-docs.tgz -T coverage-docs.list

    - name: Upload the coverage outputs for the docs
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-docs
        path: coverage-docs.tgz
        if-no-files-found: error
        retention-days: 1

  docs-examples:
    # the programs of docs/examples are built and run, their snippets and outputs regenerated and the figures redrawn:
    # the committed ones, included by the documentation, must match what the code produces
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      run: fobis fetch

    - name: Build foresight
      run: |
        git clone --depth 1 --branch v0.4.0 https://github.com/szaghi/foresight "$RUNNER_TEMP/foresight"
        (cd "$RUNNER_TEMP/foresight" && fobis fetch && fobis build --mode foresight-gnu)
        echo "$RUNNER_TEMP/foresight/bin" >> "$GITHUB_PATH"

    - name: Build and run the examples
      run: bash scripts/docs_examples.sh

    - name: Check the committed snippets, outputs and figures
      run: |
        git add --intent-to-add docs/examples docs/public/figures
        git diff --exit-code -- docs/examples docs/public/figures || {
          echo "::error::docs/examples is out of date: run 'bash scripts/docs_examples.sh' and commit the result"
          exit 1
        }
