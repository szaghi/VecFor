name: Docs examples

# Project-owned workflow (not managed by `fobis scaffold`): the programs of docs/examples are built and run, their
# snippets and outputs regenerated and the figures redrawn with foresight; the committed ones, included by the
# documentation, must match what the code produces.

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  docs-examples:
    name: docs examples / gfortran-14
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        gcc-version: '14'

    - name: Fetch dependencies
      run: fobis fetch

    - name: Build foresight
      run: |
        git clone --depth 1 --branch v0.4.0 https://github.com/szaghi/foresight "$RUNNER_TEMP/foresight"
        (cd "$RUNNER_TEMP/foresight" && fobis fetch && fobis build --mode foresight-gnu)
        echo "$RUNNER_TEMP/foresight/bin" >> "$GITHUB_PATH"

    - name: Build and run the examples
      run: bash scripts/docs_examples.sh

    - name: Check the committed snippets, outputs and figures
      run: |
        git add --intent-to-add docs/examples docs/public/figures
        git diff --exit-code -- docs/examples docs/public/figures || {
          echo "::error::docs/examples is out of date: run 'bash scripts/docs_examples.sh' and commit the result"
          exit 1
        }
